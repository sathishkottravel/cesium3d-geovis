name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build static site
        run: bun run build:web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Configure these under Settings → Secrets and variables → Actions → Variables
          VITE_TRANSPORT: ${{ vars.VITE_TRANSPORT || 'standalone' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          # Health URLs woken when the telemetry page opens (Actions → Variables, not a secret).
          # Never pass the telemetry API token here: VITE_ values are embedded in the public bundle.
          VITE_TELEMETRY_WAKE_URLS: ${{ vars.VITE_TELEMETRY_WAKE_URLS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
