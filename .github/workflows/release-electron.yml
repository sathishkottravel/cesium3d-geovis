name: Release Electron app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Make distributables
        run: bun run electron:make
        env:
          VITE_TRANSPORT: ${{ vars.VITE_TRANSPORT || 'standalone' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          # Health URLs woken when the telemetry page opens (Actions → Variables, not a secret).
          # Never pass the telemetry API token here: VITE_ values are embedded in the public bundle.
          VITE_TELEMETRY_WAKE_URLS: ${{ vars.VITE_TELEMETRY_WAKE_URLS }}
      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: out/make/**

  release:
    needs: make
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
